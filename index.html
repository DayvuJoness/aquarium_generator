<!DOCTYPE html>
<html lang="ru" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Генератор аквариумов для LightBurn</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #1e1e1e;
            color: #f0f0f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 340px;
            background: #252526;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            z-index: 10;
        }
        html[dir="rtl"] #sidebar {
            border-right: none;
            border-left: 1px solid #333;
        }
        html[dir="rtl"] input, html[dir="rtl"] select {
            text-align: right;
        }
 
        .lang-switcher {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }
        .lang-btn {
            flex: 1;
            background: #3c3c3c;
            border: 1px solid #555;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin-top: 0;
        }
        .lang-btn.active {
            background: #0e639c;
            border-color: #1177bb;
        }
 
        h2 { font-size: 18px; margin-top: 0; color: #4ec9b0; }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label { font-size: 13px; color: #bbb; }
        input, select {
            background: #3c3c3c;
            border: 1px solid #555;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background: #1177bb; }
        
        /* Стили для блока кнопок в ряд */
        .button-group {
            display: flex;
            gap: 10px;
        }
        .button-group button {
            flex: 1;
        }
        #btn-share {
            background: #2b9348;
        }
        #btn-share:hover {
            background: #40916c;
        }

        .grp { display: flex; flex-direction: column; gap: 15px; }
        input[readonly] { opacity: .55; cursor: default; }
        .vec { border: 1px solid #444; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .vec-h { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .mini { padding: 4px 8px; margin: 0 0 0 4px; font-size: 12px; }
        .mini.red { background: #a1260d; }
        #viewer {
            flex-grow: 1;
            position: relative;
        }
        #info-hint {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #888;
            pointer-events: none;
        }
        html[dir="rtl"] #info-hint {
            right: auto;
            left: 15px;
        }

        /* Мобильная адаптация */
        /* Адаптивность для мобильных устройств (ширина экрана до 768px) */
        @media (max-width: 768px) {
            body {
                flex-direction: column; /* Меняем направление флекс-контейнера на колонку */
            }
            
            #sidebar {
                width: 100%;           /* Панель занимает всю ширину экрана */
                max-height: 40vh;      /* Ограничиваем высоту панели, чтобы оставалось место для 3D-сцены */
                border-right: none;    
                border-bottom: 1px solid #333; /* Граница снизу вместо правой */
            }
            
            #viewer {
                width: 100%;
                flex-grow: 1;          /* Канвас заполняет всё оставшееся пространство снизу */
            }
        }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
 
    <div id="sidebar">
        <div class="lang-switcher">
            <button class="lang-btn" id="btn-ru" onclick="setLanguage('ru')">РУС</button>
            <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">ENG</button>
            <button class="lang-btn" id="btn-he" onclick="setLanguage('he')">עברית</button>
        </div>
 
        <h2 id="ui-title">Параметры аквариума</h2>
 
        <div class="control-group">
            <label id="lbl-length">Длина (mm):</label>
            <input type="number" id="length" value="300" min="10">
        </div>
        <div class="control-group">
            <label id="lbl-width">Ширина (mm):</label>
            <input type="number" id="width" value="250" min="10">
        </div>
        <div class="control-group">
            <label id="lbl-height">Высота (mm):</label>
            <input type="number" id="height" value="200" min="10">
        </div>
        <div class="control-group">
            <label id="lbl-thickness">Толщина стенок (mm):</label>
            <input type="number" id="thickness" value="3" min="1" max = "20" step="1">
        </div>
 
        <h2 id="ui-insert-title" style="margin-top: 10px;">Внутренняя подложка</h2>
 
        <div class="control-group">
            <label id="lbl-insert-mat">Материал подложки:</label>
            <select id="insertMaterial">
                <option value="black" id="opt-black">Чёрный</option>
                <option value="mirror" id="opt-mirror">Зеркальный</option>
            </select>
        </div>
        <div class="control-group">
            <label id="lbl-insert-thick">Толщина подложки (mm):</label>
            <input type="number" id="insertThickness" value="3" min="1" max = "20" step="1">
        </div>
        <div class="control-group">
            <label data-i="insType">Тип подложки:</label>
            <select id="insertType">
                <option value="center" data-i="tCenter">Отверстие по центру</option>
                <option value="offset" data-i="tOffset">Смещённое отверстие</option>
                <option value="tab" data-i="tTab">С выступом (загиб)</option>
                <option value="custom" data-i="tCustom">Свои рисунки (SVG / LBRN2)</option>
            </select>
        </div>
        <div class="grp" id="grp-hole">
        <div class="control-group">
            <label id="lbl-hole-w">Ширина отверстия в подложке (0 - без дырки):</label>
            <input type="number" id="holeW" value="200" min="0">
        </div>
        <div class="control-group">
            <label id="lbl-hole-h">Длина отверстия в подложке (0 - без дырки):</label>
            <input type="number" id="holeH" value="150" min="0">
        </div>
        </div>
        <div class="grp" id="grp-offset">
            <div class="control-group">
                <label data-i="offL">Отступ отверстия слева (mm):</label>
                <input type="number" id="offLeft" value="20" step="1">
            </div>
            <div class="control-group">
                <label data-i="offT">Отступ отверстия сверху (mm):</label>
                <input type="number" id="offTop" value="20" step="1">
            </div>
            <div class="control-group">
                <label data-i="offR">Отступ справа (mm), авто:</label>
                <input type="number" id="offRight" value="" step="1" readonly>
            </div>
            <div class="control-group">
                <label data-i="offB">Отступ снизу (mm), авто:</label>
                <input type="number" id="offBottom" value="" step="1" readonly>
            </div>
        </div>
        <div class="grp" id="grp-tab">
            <div class="control-group">
                <label data-i="tabW">Ширина таблички (поперёк выступа, mm):</label>
                <input type="number" id="nameWid" value="100" min="1" max="500" step="1">
            </div>
            <div class="control-group">
                <label data-i="tabL">Длина таблички (вдоль выступа, mm):</label>
                <input type="number" id="nameLen" value="25" min="1" max="70" step="1">
            </div>
            <div class="control-group">
                <label data-i="slotD">Глубина прорези в подложку (mm):</label>
                <input type="number" id="slotDepth" value="10" step="1" min="2">
            </div>
            <div class="control-group">
                <label data-i="bendP">Центр сгиба (засечки) от начала прорези (mm):</label>
                <input type="number" id="bendPos" value="8" step="1" min="2">
            </div>
        </div>
        <div class="grp" id="grp-custom">
            <div class="grp" id="vectors-list"></div>
            <button id="btn-add-vec" onclick="document.getElementById('vecFile').click()">Добавить вектор (0/5)</button>
            <input type="file" id="vecFile" accept=".svg,.lbrn2" style="display:none" onchange="onVecFile(event)">
        </div>
 
        <!-- Блок кнопок сохранения и отправки -->
        <div class="button-group">
            <button id="btn-export" onclick="exportToLBRN2()">Сохранить</button>
            <button id="btn-share" onclick="shareToSocial()">Поделиться</button>
        </div>
    </div>
 
    <div id="viewer">
        <div id="info-hint">Вращение: ЛКМ | Панорама: ПКМ | Зум: Колесико</div>
    </div>

            tCenter: "חור במרכז",
            tOffset: "חור מוזז",
            tTab: "עם לשונית מקופלת",
            tCustom: "ציורים מותאמים (SVG / LBRN2)",
            offL: "מרחק החור משמאל (mm):",
            offT: "מרחק החור מלמעלה (mm):",
            offR: "מרחק מימין (mm), אוטומטי:",
            offB: "מרחק מלמטה (mm), אוטומטי:",
            tabW: "רוחב השלט (לרוחב הלשונית, mm):",
            tabL: "אורך השלט (לאורך הלשונית, mm):",

            bendP: "מרכז הקיפול (סימנים) מתחילת החריץ (mm):",

            vLeft: "מרחק משמאל (mm)",
            vTop: "מרחק מלמעלה (mm)",
            vRight: "מרחק מימין (mm), אוטומטי",
            vBottom: "מרחק מלמטה (mm), אוטומטי",
            vW: "רוחב (mm)",
            vH: "גובה (mm)",
            vErr: "לא ניתן לקרוא את הקובץ (נדרש SVG או LBRN2)",

            share: "שתף",
            hint: "סיבוב: לחצן שמאלי | פנומה: לחצן ימני | זום: גלגלת",

            material: "אקריליק שקוף",
            materialBottom: "אקריליק שחור",
            materialMirror: "אקריליק מראה",
            materialAlign: "יישור",
            shareMessage: "ציור אקווריום לחיתוך לייזר",
            shareAlert: "...השיתוף נדחה או חסום, הפעל את ההורדה"
        }
    };
 
    let currentLang = localStorage.getItem('aquarium_lang') || 'ru';
 
    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('aquarium_lang', lang);
 
        const htmlRoot = document.getElementById('htmlRoot');
        if (lang === 'he') {
            htmlRoot.setAttribute('dir', 'rtl');
        } else {
            htmlRoot.setAttribute('dir', 'ltr');
        }
 
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        const btnElem = document.getElementById(`btn-${lang}`);
        if (btnElem) btnElem.classList.add('active');
 
        const t = dict[lang];
        document.getElementById('pageTitle').innerText = t.title;
        document.getElementById('ui-title').innerText = t.header;
        document.getElementById('ui-insert-title').innerText = t.insertHeader;
        document.getElementById('lbl-length').innerText = t.length;
        document.getElementById('lbl-width').innerText = t.width;
        document.getElementById('lbl-height').innerText = t.height;
        document.getElementById('lbl-thickness').innerText = t.thickness;
        document.getElementById('lbl-insert-mat').innerText = t.insertMat;
        document.getElementById('opt-mirror').innerText = t.optMirror;
        document.getElementById('opt-black').innerText = t.optBlack;
        document.getElementById('lbl-insert-thick').innerText = t.insertThick;
        document.getElementById('lbl-hole-w').innerText = t.holeW;
        document.getElementById('lbl-hole-h').innerText = t.holeH;
        document.getElementById('btn-export').innerText = t.export;
        document.getElementById('btn-share').innerText = t.share;
        document.getElementById('info-hint').innerText = t.hint;
        document.querySelectorAll('[data-i]').forEach(e => e.innerText = t[e.dataset.i]);
        renderVectors();
 
        if (typeof boxGroup !== 'undefined' && boxGroup) {
            updateScene();
        }
    }
 
    let scene, camera, renderer, controls;
    let boxGroup;
    let autoRotate = true;

    const dimensionSprites = {};
 

    // ===== Типы подложек: хелперы =====
    const TAB_ANGLE = 70, MAXV = 5;
    let vectors = [];
    const $ = id => document.getElementById(id);
    const num = id => parseFloat($(id).value) || 0;
    const r1 = x => Math.round(x * 10) / 10;
    const getType = () => $('insertType').value;
    function dims() {
        const L = num('length') || 300, W = num('width') || 200, T = num('thickness') || 3;
        return { L, W, T, pl: Math.max(1, L - 2 * T), pw: Math.max(1, W - 2 * T) };
    }
    function tabP() {
        const { pl, pw } = dims(), IT = num('insertThickness') || 2;
        const r = Math.max(IT * 2, 2), phi = Math.PI - TAB_ANGLE * Math.PI / 180, arc = r * phi;
        const pLen = Math.max(1, num('nameLen')), pWid = Math.max(1, num('nameWid'));
        // сгиб целиком внутри аквариума: самая выпуклая точка не дальше края подложки
        const sd = Math.min(Math.max(num('slotDepth'), r + IT / 2 + 0.5), pw - 1);
        const bpMin = arc / 2, bpMax = Math.max(bpMin, sd + arc / 2 - r - IT / 2);
        const bp = Math.min(Math.max(num('bendPos'), bpMin), bpMax);
        // свободные 2 мм вокруг таблички (с боков, у конца выступа и от конца сгиба)
        const rem = Math.max(pLen + 4, sd - bp - arc / 2 + 1);
        return { tw: Math.min(pWid + 4, pl - 1), sd, bp, rem, r, phi, arc, IT, pLen, pWid };
    }
    function updateTypeUI() {
        const ty = getType(), show = (id, c) => $(id).style.display = c ? 'flex' : 'none';
        show('grp-hole', ty === 'center' || ty === 'offset' || ty === 'tab');
        show('grp-offset', ty === 'offset');
        show('grp-tab', ty === 'tab');
        show('grp-custom', ty === 'custom');
    }
    // координаты векторов относительно левого-верхнего угла подложки
    function vecWorld(v) {
        return v.shapes.map(s => ({ closed: s.closed, pts: s.pts.map(([u, w]) => {
            let a = u, b = w;
            for (let i = 0; i < v.rot; i++) [a, b] = [1 - b, a];
            return [v.left + a * v.w, v.top + b * v.h];
        }) }));
    }
    function refreshVec(d, v) {
        const { pl, pw } = dims();
        d.querySelector('[data-k=right]').value = r1(pl - v.left - v.w);
        d.querySelector('[data-k=bottom]').value = r1(pw - v.top - v.h);
    }
    function renderVectors() {
        const t = dict[currentLang], box = $('vectors-list');
        box.innerHTML = '';
        vectors.forEach((v, i) => {
            const d = document.createElement('div');
            d.className = 'vec';
            d.innerHTML = '<div class="vec-h"><b></b><span><button class="mini" data-a="rot">⟳ 90°</button><button class="mini red" data-a="del">✕</button></span></div>' +
                [['left', t.vLeft], ['top', t.vTop], ['w', t.vW], ['h', t.vH]].map(([k, l]) => `<div class="control-group"><label>${l}</label><input type="number" step="1" data-k="${k}" value="${r1(v[k])}"></div>`).join('') +
                [['right', t.vRight], ['bottom', t.vBottom]].map(([k, l]) => `<div class="control-group"><label>${l}</label><input type="number" data-k="${k}" readonly></div>`).join('');
            d.querySelector('b').textContent = `${i + 1}. ${v.name}`;
            d.querySelectorAll('input:not([readonly])').forEach(inp => inp.addEventListener('input', () => {
                const k = inp.dataset.k, val = parseFloat(inp.value) || 0;
                v[k] = (k === 'w' || k === 'h') ? Math.max(0.1, val) : val;
                refreshVec(d, v); updateScene();
            }));
            d.querySelector('[data-a=rot]').onclick = () => {

    function addVector(name, shapes) {

            shapes: shapes.map(s => ({ closed: s.closed, pts: s.pts.map(([x, y]) => [(x - x0) / nw, (y - y0) / nh]) })) });

    function parseSVG(txt) {
        const src = new DOMParser().parseFromString(txt, 'image/svg+xml').documentElement;
        if (src.nodeName.toLowerCase() !== 'svg') throw new Error('not svg');
        const NS = 'http://www.w3.org/2000/svg', host = document.createElement('div');
        host.style.cssText = 'position:absolute;left:-9999px;top:0;width:2000px;height:2000px;overflow:hidden;visibility:hidden';
        const svg = document.importNode(src, true);
        host.appendChild(svg); document.body.appendChild(host);
        const out = [];
        const mk = d => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); svg.appendChild(p); return p; };
        const sample = (P, M) => {
            const len = P.getTotalLength(), n = Math.min(1200, Math.max(8, Math.ceil(len * 2))), a = [];
            for (let i = 0; i <= n; i++) { const p = P.getPointAtLength(len * i / n); const q = new DOMPoint(p.x, p.y).matrixTransform(M); a.push([q.x, q.y]); }
            return a;
        };
        try {
            const rootInv = svg.getScreenCTM().inverse();
            svg.querySelectorAll('path,rect,circle,ellipse,line,polyline,polygon').forEach(el => {
                if (el.closest('defs,clipPath,mask,symbol,pattern,marker') || !el.getTotalLength) return;
                const M = rootInv.multiply(el.getScreenCTM()), tag = el.tagName;
                if (tag === 'path') {
                    let prefix = '';
                    (el.getAttribute('d') || '').split(/(?=[Mm])/).filter(s => s.trim()).forEach(sp => {
                        let start = '';
                        if (prefix) { const tp = mk(prefix), e = tp.getPointAtLength(tp.getTotalLength()); start = `M${e.x} ${e.y} `; }
                        out.push({ pts: sample(mk(start + sp), M), closed: /z\s*$/i.test(sp) });
                        prefix += sp;
                    });
                } else out.push({ pts: sample(el, M), closed: !/^(line|polyline)$/.test(tag) });
            });
        } finally { host.remove(); }
        return out;
    }
    function parseLBRN(txt) {
        const doc = new DOMParser().parseFromString(txt, 'text/xml'), out = [];
        const mul = (p, c) => [p[0]*c[0]+p[2]*c[1], p[1]*c[0]+p[3]*c[1], p[0]*c[2]+p[2]*c[3], p[1]*c[2]+p[3]*c[3], p[0]*c[4]+p[2]*c[5]+p[4], p[1]*c[4]+p[3]*c[5]+p[5]];
        const kid = (el, n) => [...el.children].find(c => c.tagName === n);
        const walk = (parent, M) => [...parent.children].filter(c => c.tagName === 'Shape').forEach(sh => {
            const xf = kid(sh, 'XForm'), M2 = mul(M, xf ? xf.textContent.trim().split(/\s+/).map(Number) : [1, 0, 0, 1, 0, 0]);
            const tp = sh.getAttribute('Type'), tr = ([x, y]) => [M2[0]*x+M2[2]*y+M2[4], M2[1]*x+M2[3]*y+M2[5]];
            if (tp === 'Group') { const ch = kid(sh, 'Children'); if (ch) walk(ch, M2); }
            else if (tp === 'Rect') {
                const w = +sh.getAttribute('W') / 2, h = +sh.getAttribute('H') / 2;
                out.push({ pts: [[-w,-h],[w,-h],[w,h],[-w,h]].map(tr), closed: true });
            } else if (tp === 'Ellipse') {
                const rx = +sh.getAttribute('Rx'), ry = +sh.getAttribute('Ry'), a = [];
                for (let i = 0; i < 64; i++) a.push(tr([rx * Math.cos(i / 32 * Math.PI), ry * Math.sin(i / 32 * Math.PI)]));
                out.push({ pts: a, closed: true });
            } else if (tp === 'Path') {
                const vl = kid(sh, 'VertList'), pl = kid(sh, 'PrimList');
                if (!vl || !pl) return;
                const N = '([-\\d.eE+]+)';
                const vs = vl.textContent.split('V').slice(1).map(s => {
                    const m = s.match(new RegExp('^\\s*' + N + '\\s+' + N)), g = k => { const r = s.match(new RegExp(k + N)); return r ? +r[1] : null; };
                    return { x: +m[1], y: +m[2], c0: [g('c0x'), g('c0y')], c1: [g('c1x'), g('c1y')] };
                });
                const P = []; let first = null, last = null;
                for (const m of pl.textContent.matchAll(/([LB])(\d+) (\d+)/g)) {
                    const A = vs[+m[2]], B = vs[+m[3]];
                    if (first === null) { first = +m[2]; P.push([A.x, A.y]); }
                    if (m[1] === 'B' && A.c1[1] != null && B.c0[1] != null) {
                        for (let i = 1; i <= 12; i++) {
                            const t = i / 12, u = 1 - t, f = (a, b, c, d) => u*u*u*a + 3*u*u*t*b + 3*u*t*t*c + t*t*t*d;
                            P.push([f(A.x, A.c1[0], B.c0[0], B.x), f(A.y, A.c1[1], B.c0[1], B.y)]);
                        }
                    } else P.push([B.x, B.y]);
                    last = +m[3];
                }
                if (P.length) out.push({ pts: P.map(tr), closed: first === last && P.length > 2 });
            }
        });
        walk(doc.documentElement, [1, 0, 0, 1, 0, 0]);
        return out;
    }

    let targetCamPos = new THREE.Vector3();
    let targetLookAt = new THREE.Vector3();
    let isAnimatingCamera = false;

    function fitCameraToAquarium(L, W, H) {
        const maxDim = Math.max(L, W, H * 1.35);
        const container = document.getElementById('viewer');
        const aspect = container.clientWidth / container.clientHeight;
        
        let targetDistance = maxDim * 2.2;
        if (aspect < 1) {
            targetDistance = targetDistance / aspect * 1;
        }

        const dir = camera.position.clone().sub(controls.target).normalize();
        if (dir.lengthSq() === 0) {
            dir.set(1, 0.5, 0.7).normalize();
        }

        // Целевая точка всегда в центре (0, 0, 0)
        targetLookAt.set(0, 0, 0);
        // Целевая позиция камеры
        targetCamPos.copy(targetLookAt).addScaledVector(dir, targetDistance);
        
        // Включаем флаг плавной анимации
        isAnimatingCamera = true;
    }

    function onWindowResize() {
        const container = document.getElementById('viewer');
        camera.aspect = container.clientWidth / container.clientHeight;

        renderer.setSize(container.clientWidth, container.clientHeight);

        const L = parseFloat(document.getElementById('length').value) || 10;
        const W = parseFloat(document.getElementById('width').value) || 10;
        const H = parseFloat(document.getElementById('height').value) || 10;
        fitCameraToAquarium(L, W, H);
    }


 
    function createDimensionBracket(key, startVec, endVec, text, offsetDir = new THREE.Vector3(0, 1, 0), offsetDist = 15) {
        const group = new THREE.Group();
        const s = startVec.clone().addScaledVector(offsetDir, offsetDist);
        const e = endVec.clone().addScaledVector(offsetDir, offsetDist);
 
        const segmentLength = s.distanceTo(e);
        const peakDepth = 12; // Фиксированная глубина, чтобы не прыгало
 
        const midPoint = new THREE.Vector3().addVectors(s, e).multiplyScalar(0.5);
        const peakPoint = midPoint.clone().addScaledVector(offsetDir, peakDepth);
 
        // Проверяем, создан ли уже спрайт для этого параметра (key, например 'width', 'height' и т.д.)
        if (!dimensionSprites[key]) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const context = canvas.getContext('2d');
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            
            dimensionSprites[key] = { sprite, canvas, context, texture };
        }

        const cached = dimensionSprites[key];
        const context = cached.context;
        
        // Чистим холст и рисуем новый текст без пересоздания объекта
        context.clearRect(0, 0, cached.canvas.width, cached.canvas.height);
        context.font = `Bold 36px Arial`;
        context.fillStyle = '#4ec9b0';
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText(text, 128, 32);
        
        // Сообщаем Three.js, что текстуру нужно обновить на GPU
        cached.texture.needsUpdate = true;

        const sprite = cached.sprite;
        sprite.position.copy(peakPoint).addScaledVector(offsetDir, 8);

        const isMobile = window.innerWidth <= 768;
        const sizeMultiplier = isMobile ? 1.4 : 1.0;

        const tempWorldPos = new THREE.Vector3();
        sprite.onBeforeRender = (renderer, scene, camera) => {
            sprite.getWorldPosition(tempWorldPos);
            const distanceToCamera = camera.position.distanceTo(tempWorldPos);
            const scale = distanceToCamera * 0.08 * sizeMultiplier;
            sprite.scale.set(scale * 1.8, scale * 0.6, 1);
        };

        group.add(sprite);
 
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
 
        const whiskersGeom = new THREE.BufferGeometry().setFromPoints([
            startVec.clone(), s,
            e, endVec.clone()
        ]);
        const whiskers = new THREE.LineSegments(whiskersGeom, lineMat);
        group.add(whiskers);
 
        const pinch = peakDepth * 0.35;
        const control1 = s.clone().lerp(peakPoint, 0.5).addScaledVector(offsetDir, -pinch);
        const control2 = e.clone().lerp(peakPoint, 0.5).addScaledVector(offsetDir, -pinch);
 
        const curve1 = new THREE.QuadraticBezierCurve3(s, control1, peakPoint);
        const curve2 = new THREE.QuadraticBezierCurve3(peakPoint, control2, e);
 
        const curvePoints = [...curve1.getPoints(15), ...curve2.getPoints(15)];
        const curveGeom = new THREE.BufferGeometry().setFromPoints(curvePoints);
        const bracketCurve = new THREE.Line(curveGeom, lineMat);
        group.add(bracketCurve);
 
        return group;
    }

        if (hole) {

        boxGroup.add(insertMesh);

        // Выступ: загнут вверх на TAB_ANGLE° (0° = сложен на подложку, 180° = разложен), сгиб скруглён, центр сгиба = bendPos

            const qm = phi / 2, cn = [-Math.sin(qm), Math.cos(qm)], o2 = IT / 2 + 0.12;

            const tickMat = new THREE.LineBasicMaterial({ color: 0xe0e0e0 });
            [[-K.tw / 2, -K.tw / 2 + 3], [K.tw / 2 - 3, K.tw / 2]].forEach(([xa, xb]) => {
                boxGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
                    [new THREE.Vector3(xa, my, mz), new THREE.Vector3(xb, my, mz)]), tickMat));
            });
            // контур таблички на наружной стороне выступа (только превью, в экспорт не попадает)
            const off = IT / 2 + 0.15, pt = (s, x) => new THREE.Vector3(x,
                e[1] + Math.sin(phi) * s + (-Math.cos(phi)) * off + baseY, e[0] + Math.cos(phi) * s + Math.sin(phi) * off);
            const hw = K.pWid / 2;
            boxGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
                [pt(2, -hw), pt(2, hw), pt(2 + K.pLen, hw), pt(2 + K.pLen, -hw), pt(2, -hw)]),
                new THREE.LineBasicMaterial({ color: 0xe0e0e0 })));
        }

        // Свои рисунки: контуры поверх подложки
        if (ptype === 'custom') {
            document.querySelectorAll('.vec').forEach((d, i) => vectors[i] && refreshVec(d, vectors[i]));
            vectors.forEach(v => vecWorld(v).forEach(s => {
                const pts = s.pts.map(([x, y]) => new THREE.Vector3(-D.pl / 2 + x, T + IT + 0.2, -D.pw / 2 + y));
                if (s.closed) pts.push(pts[0].clone());
                boxGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xffaa00 })));
            }));
        }
 
        const frontBackGeo = new THREE.BoxGeometry(L, H, T);
 
        const frontMesh = new THREE.Mesh(frontBackGeo, clearAcrylicMaterial);
        frontMesh.position.set(0, H/2 + T + 0.1, W/2 - T/2);
        addEdges(frontMesh, 0x4ec9b0, 0.8);
        boxGroup.add(frontMesh);
 
        const backMesh = new THREE.Mesh(frontBackGeo, clearAcrylicMaterial);
        backMesh.position.set(0, H/2 + T + 0.1, -W/2 + T/2);
        addEdges(backMesh, 0x4ec9b0, 0.8);
        boxGroup.add(backMesh);
 
        const sideGeo = new THREE.BoxGeometry(T, H, W - (T * 2));
 
        const leftMesh = new THREE.Mesh(sideGeo, clearAcrylicMaterial);
        leftMesh.position.set(-L/2 + T/2, H/2 + T + 0.1, 0);
        addEdges(leftMesh, 0x4ec9b0, 0.8);
        boxGroup.add(leftMesh);
 
        const rightMesh = new THREE.Mesh(sideGeo, clearAcrylicMaterial);
        rightMesh.position.set(L/2 - T/2, H/2 + T + 0.1, 0);
        addEdges(rightMesh, 0x4ec9b0, 0.8);
        boxGroup.add(rightMesh);
 
        const lStart = new THREE.Vector3(-L/2, H + T * 2, W/2);
        const lEnd = new THREE.Vector3(L/2, H + T * 2, W/2);
        boxGroup.add(createDimensionBracket('widthDim', lStart, lEnd, `${t.lblW}: ${L}`, new THREE.Vector3(0, 1, 0), 20));
 
        const hStart = new THREE.Vector3(-L/2, T, W/2);
        const hEnd = new THREE.Vector3(-L/2, H + T, W/2);
        boxGroup.add(createDimensionBracket('heightDim', hStart, hEnd, `${t.lblH}: ${H}`, new THREE.Vector3(-1, 0, 0), 25));
 
        const wStart = new THREE.Vector3(L/2, T, -W/2);
        const wEnd = new THREE.Vector3(L/2, T, W/2);
        boxGroup.add(createDimensionBracket('lengthDim', wStart, wEnd, `${t.lblL}: ${W}`, new THREE.Vector3(1, 0, 0), 20));
 
        const tStart = new THREE.Vector3(L/2 - T, H + T, 0);
        const tEnd = new THREE.Vector3(L/2, H + T, 0);
        boxGroup.add(createDimensionBracket('thickDim', tStart, tEnd, `${t.lblT}: ${T}`, new THREE.Vector3(0, 1, 0), 15));
    }
 
    function animate() {
        requestAnimationFrame(animate);

        if (autoRotate && boxGroup && !isAnimatingCamera) {
            boxGroup.rotation.y += 0.001;
        }

        // Плавный переход камеры к новым координатам автоподгонки
        if (isAnimatingCamera) {
            camera.position.lerp(targetCamPos, 0.08);
            controls.target.lerp(targetLookAt, 0.08);
            
            // Когда камера почти долетела, отключаем анимацию
            if (camera.position.distanceTo(targetCamPos) < 0.5) {
                isAnimatingCamera = false;
            }
        }

        controls.update();
        renderer.render(scene, camera);
    }
 
    function onWindowResize() {
        const container = document.getElementById('viewer');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }
 
    // Общая функция генерации XML-строки проекта LightBurn
    function generateLBRN2Content() {
        const L = parseFloat(document.getElementById('length').value) || 300;
        const W = parseFloat(document.getElementById('width').value) || 200;
        const H = parseFloat(document.getElementById('height').value) || 150;
        const T = parseFloat(document.getElementById('thickness').value) || 3;
 
        const hW = parseFloat(document.getElementById('holeW').value) || 0;
        const hH = parseFloat(document.getElementById('holeH').value) || 0;
        
        const insertL = Math.max(1, L - (T * 2));
        const insertW = Math.max(1, W - (T * 2));

        const gap = 15;
        const yTopWall = 225;
        const xInsert = 300;
        const yInsert = yTopWall + H + gap;
        const xBottom = xInsert + insertL + gap;
        const yBottom = yInsert;

        let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
        xml += `<LightBurnProject AppVersion="2.1.03" DeviceName="Ruida 644XS" FormatVersion="1" MaterialHeight="${T}" MirrorX="False" MirrorY="True" AskForSendName="True">\n`;
        
        xml += `    <CutSetting type="Cut">\n`;
        xml += `        <index Value="28"/>\n`;
        xml += `        <name Value="${dict[currentLang].materialAlign}"/>\n`;
        xml += `        <minPower Value="34"/>\n`;
        xml += `        <maxPower Value="35"/>\n`;
        xml += `        <speed Value="100"/>\n`;
        xml += `        <numPasses Value="1"/>\n`;
        xml += `        <priority Value="0"/>\n`;
        xml += `    </CutSetting>\n`;

        xml += `    <CutSetting type="Cut">\n`;
        xml += `        <index Value="1"/>\n`;
        xml += `        <name Value="${dict[currentLang].materialMirror}"/>\n`;
        xml += `        <minPower Value="37.5"/>\n`;
        xml += `        <maxPower Value="38.5"/>\n`;
        xml += `        <speed Value="17"/>\n`;
        xml += `        <numPasses Value="2"/>\n`;
        xml += `        <priority Value="1"/>\n`;
        xml += `    </CutSetting>\n`;

        xml += `    <CutSetting type="Cut">\n`;
        xml += `        <index Value="25"/>\n`;
        xml += `        <name Value="${dict[currentLang].materialBottom}"/>\n`;
        xml += `        <minPower Value="37.5"/>\n`;
        xml += `        <maxPower Value="38.5"/>\n`;
        xml += `        <speed Value="20"/>\n`;
        xml += `        <numPasses Value="3"/>\n`;
        xml += `        <priority Value="1"/>\n`;
        xml += `    </CutSetting>\n`;

        xml += `    <CutSetting type="Cut">\n`;
        xml += `        <index Value="26"/>\n`;
        xml += `        <name Value="${dict[currentLang].material} ${T}мм"/>\n`;
        xml += `        <minPower Value="37"/>\n`;
        xml += `        <maxPower Value="38"/>\n`;
        xml += `        <speed Value="6.5"/>\n`;
        xml += `        <numPasses Value="1"/>\n`;
        xml += `        <priority Value="1"/>\n`;
        xml += `    </CutSetting>\n`;

        let pid = 10;
        const mat = document.getElementById('insertMaterial').value === 'mirror' ? 1 : 25;
        const type = getType();
        const rect = (ci, w, h, x, y) => `    <Shape Type="Rect" CutIndex="${ci}" W="${w}" H="${h}" Cr="0">\n        <XForm>1 0 0 1 ${x} ${y}</XForm>\n    </Shape>\n`;
        const poly = (ci, pts, closed) => {
            const n = pts.length; let p = '';
            for (let i = 0; i < n - 1; i++) p += `L${i} ${i + 1}`;
            if (closed) p += `L${n - 1} 0`;
            const id = pid++;
            return `    <Shape Type="Path" CutIndex="${ci}" VertID="${id}" PrimID="${id}">\n        <XForm>1 0 0 1 0 0</XForm>\n        <VertList>${pts.map(([x, y]) => `V${x} ${y}c0x1c1x1`).join('')}</VertList>\n        <PrimList>${p}</PrimList>\n    </Shape>\n`;
        };
        const wrap = s => `    <Shape Type="Group" CutIndex="0">\n        <XForm>1 0 0 1 0 0</XForm>\n        <Children>\n${s}        </Children>\n    </Shape>\n`;
        const cx = (type === 'center' && hW > 0 && hH > 0) ? xInsert - T : xInsert, cy = yInsert;
        const X0 = cx - insertL / 2, Y0 = cy - insertW / 2;
        if (type === 'center') {
            xml += (hW > 0 && hH > 0) ? wrap(rect(mat, insertL, insertW, cx, cy) + rect(mat, hW, hH, cx, cy)) : rect(26, insertL, insertW, cx, cy);
        } else if (type === 'offset') {
            const oL = parseFloat(document.getElementById('offLeft').value) || 0, oT = parseFloat(document.getElementById('offTop').value) || 0;
            xml += (hW > 0 && hH > 0) ? wrap(rect(mat, insertL, insertW, cx, cy) + rect(mat, hW, hH, X0 + oL + hW / 2, Y0 + oT + hH / 2)) : rect(mat, insertL, insertW, cx, cy);
        } else if (type === 'tab') {
            const k = tabP(), xl = cx - k.tw / 2, xr = cx + k.tw / 2, y1 = Y0 + insertW, yb = y1 - k.sd + k.bp, tip = yb + k.arc / 2 + k.rem;
            xml += wrap(
                poly(mat, [[X0, Y0], [X0 + insertL, Y0], [X0 + insertL, y1], [xr, y1], [xr, tip], [xl, tip], [xl, y1], [X0, y1]], true) +
                poly(mat, [[xl, y1 - k.sd], [xl, y1]], false) + poly(mat, [[xr, y1 - k.sd], [xr, y1]], false) +
                poly(28, [[xl, yb], [xl + 3, yb]], false) + poly(28, [[xr - 3, yb], [xr, yb]], false) +
                ((hW > 0 && hH > 0 && hW < insertL && hH / 2 < insertW / 2 - k.sd) ? rect(mat, hW, hH, cx, cy) : ''));
        } else {
            let s = rect(mat, insertL, insertW, cx, cy);
            vectors.forEach(v => vecWorld(v).forEach(sp => { s += poly(mat, sp.pts.map(([x, y]) => [r1(X0 + x), r1(Y0 + y)]), sp.closed); }));
            xml += vectors.length ? wrap(s) : s;
        }
        xml += `    <Shape Type="Group" CutIndex="0">\n`;
        xml += `        <XForm>1 0 0 1 0 0</XForm>\n`;
        xml += `        <Children>\n`;
        xml += `            <Shape Type="Rect" CutIndex="25" W="${L}" H="${W}" Cr="0">\n`;
        xml += `                <XForm>1 0 0 1 ${xBottom} ${yBottom}</XForm>\n`;
        xml += `            </Shape>\n`;
        xml += `            <Shape Type="Rect" CutIndex="28" W="${L - (T * 2)}" H="${W - (T * 2)}" Cr="0">\n`;
        xml += `                <XForm>1 0 0 1 ${xBottom} ${yBottom}</XForm>\n`;
        xml += `            </Shape>\n`;
        xml += `        </Children>\n`;
        xml += `    </Shape>\n`;

        xml += `    <Shape Type="Rect" CutIndex="26" W="${L}" H="${H}" Cr="0">\n`;
        xml += `        <XForm>1 0 0 1 ${xBottom} ${yBottom + (H / 2) + (W / 2) + gap}</XForm>\n`;
        xml += `    </Shape>\n`;

        const l1x1 = xBottom + (L / 2) - T, l1y1 = yBottom + (W / 2) + gap;
        const l1x2 = xBottom + (L / 2) - T, l1y2 = yBottom + (W / 2) + gap + H;

        xml += `    <!-- Блок: Прямая линия -->\n`;
        xml += `    <Shape Type="Path" CutIndex="28" VertID="0" PrimID="0">\n`;
        xml += `        <XForm>1 0 0 1 0 0</XForm>\n`;
        xml += `        <VertList>V${l1x1} ${l1y1}c0x1c1x${l1x1}c1y${l1y1}V${l1x2} ${l1y2}c0x${l1x2}c0y${l1y2}c1x1</VertList>\n`;
        xml += `        <PrimList>L0 1</PrimList>\n`;
        xml += `    </Shape>\n`;

        const l2x1 = xBottom - (L / 2) + T, l2y1 = yBottom + (W / 2) + gap;
        const l2x2 = xBottom - (L / 2) + T, l2y2 = yBottom + (W / 2) + gap + H;

        xml += `    <!-- Блок: Прямая линия -->\n`;
        xml += `    <Shape Type="Path" CutIndex="28" VertID="1" PrimID="0">\n`;
        xml += `        <XForm>1 0 0 1 0 0</XForm>\n`;
        xml += `        <VertList>V${l2x1} ${l2y1}c0x1c1x${l2x1}c1y${l2y1}V${l2x2} ${l2y2}c0x${l2x2}c0y${l2y2}c1x1</VertList>\n`;
        xml += `        <PrimList>L0 1</PrimList>\n`;
        xml += `    </Shape>\n`;

        xml += `    <Shape Type="Rect" CutIndex="26" W="${H}" H="${W - (T * 2)}" Cr="0">\n`;
        xml += `        <XForm>1 0 0 1 ${xBottom + (H / 2) + (L / 2) + gap} ${yBottom}</XForm>\n`;
        xml += `    </Shape>\n`;

        xml += `    <Shape Type="Group" CutIndex="0">\n`;
        xml += `        <XForm>1 0 0 1 0 0</XForm>\n`;
        xml += `        <Children>\n`;
        xml += `            <Shape Type="Rect" CutIndex="26" W="${L}" H="${W}" Cr="0">\n`;
        xml += `                <XForm>1 0 0 1 ${xBottom} ${yBottom - W - gap}</XForm>\n`;
        xml += `            </Shape>\n`;
        xml += `            <Shape Type="Rect" CutIndex="28" W="${L - (T * 2)}" H="${W - (T * 2)}" Cr="0">\n`;
        xml += `                <XForm>1 0 0 1 ${xBottom} ${yBottom - W - gap}</XForm>\n`;
        xml += `            </Shape>\n`;
        xml += `        </Children>\n`;
        xml += `    </Shape>\n`;

        xml += `    <Notes ShowOnLoad="0" Notes=""/>\n`;
        xml += `</LightBurnProject>`;

        return { xml, L, W, H };
    }
 
    function exportToLBRN2() {
        const data = generateLBRN2Content();
        const blob = new Blob([data.xml], { type: 'application/xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `aquarium_${data.L}x${data.W}x${data.H}.lbrn2`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // Новая функция «Поделиться» через Web Share API (Telegram, WhatsApp и др.)
    async function shareToSocial() {
    const data = generateLBRN2Content();
    const fileName = `aquarium_${data.L}x${data.W}x${data.H}.lbrn2`;
    const file = new File([data.xml], fileName, { type: 'application/xml' });

    // Проверяем поддержку шеринга файлов
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
            await navigator.share({
                title: 'LightBurn Aquarium',
                text: dict[currentLang].shareMessage,
                files: [file]
            });
        } catch (error) {
            // Если пользователь отменил шеринг (AbortError) — это нормально, ничего делать не нужно.
            // Если браузер заблокировал доступ (NotAllowedError) — падаем на скачивание.
            if (error.name !== 'AbortError') {
                alert(dict[currentLang].shareAlert, error);
                exportToLBRN2();
            }
        }
    } else {
        // Если браузер в принципе не поддерживает передачу файлов через API
        exportToLBRN2();
    }
}
